<text x="96" y="138" fill="#F7FAFF" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">Decomposed Readout — How Synergy Generalizes</text>
<text x="96" y="186" fill="#A8B4C2" font-family="Arial, Inter, 'Helvetica Neue', sans-serif" font-size="18" font-weight="400">Four parallel heads · baseline + stim + inhibitor + synergy · the synergy head learns only the non-additive correction — that's what enables zero-shot drug combinations</text>
